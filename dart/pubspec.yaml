name: apiverve_callingcode
description: "Country Calling Code is a phone number country code API that looks up international dialing codes and official names from a two-letter ISO country code. It returns an array of calling prefixes and standard country identifiers."
version: 1.2.3
homepage: https://apiverve.com/marketplace/callingcode?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/callingcode-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
